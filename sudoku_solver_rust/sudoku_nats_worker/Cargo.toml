[package]
name = "sudoku_nats_worker"
version = "0.1.0"
edition = "2024"

[dependencies]
async-nats = "0.46.0"
futures = "0.3.32"
serde_json = "1.0.149"
sudoku_engine = { path = "../sudoku_engine" }
tokio = { version = "1.50.0", features = ["rt", "time", "macros"] }
# Transitive dep of async-nats; time 0.3.48 fails to compile against async-nats
# (E0119 coherence conflict). Pin until fixed upstream, then remove.
time = "=0.3.47"
