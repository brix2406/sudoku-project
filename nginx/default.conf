map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    http2 on;
    client_max_body_size 8m;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Modern SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Docker embedded DNS for runtime upstream resolution
    # In Kubernetes, override via ConfigMap: resolver kube-dns.kube-system.svc.cluster.local;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $frontend_upstream frontend:5173;

    access_log /var/log/nginx/access.log combined;

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}


# GoAccess traffic dashboard — static HTML only
# GoAccess WebSocket is served directly on :7891 (not proxied through nginx)
server {
    listen 7890;
    server_name _;

    access_log off;

    location / {
        root /var/log/nginx/goaccess;
        index index.html;
    }
}
