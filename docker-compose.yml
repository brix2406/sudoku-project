services:
  nats:
    image: nats:latest
    container_name: nats-server
    command: 
    - "--js"
    ports:
      - "4222:4222" # Client connections

  sudoku_nats_worker:
    build:
      context: ./sudoku_solver_rust
      dockerfile: sudoku_nats_worker/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  service_layer_rust:
    build:
      context: .
      dockerfile: service_layer_rust/Dockerfile
    container_name: service_layer_rust
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats
  
  marmot:
    image: maxpert/marmot:latest
    container_name: marmot-sidecar
    command: 
      - "-db"
      - "/usr/local/bin/data.db "
      - "-nats"
      - "nats://nats:4222"
      - "-cluster"
      - "sudoku-cluster"
    volumes:
      - sudoku-db:/data 
    depends_on:
      - nats
      - service_layer_rust
  volumes:
    sudoku-data-db: