services:
  nats:
    image: nats:latest
    container_name: nats-server
    command: 
    - "--js"
    ports:
      - "4222:4222" # Client connections

  sudoku_nats_worker:
    build:
      context: ./sudoku_solver_rust
      dockerfile: sudoku_nats_worker/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  service_layer_rust:
    build:
      context: .
      dockerfile: service_layer_rust/Dockerfile
    container_name: service_layer_rust
    environment:
      - NATS_URL=nats://nats:4222
    volumes:
      - sudoku-db:/data
    depends_on:
      - nats
  
  marmot:
    build:
      context: ./marmot_build
    container_name: marmot-sidecar
    command: 
      - "-node-id"
      - "1"
      - "-config"
      - "/data/marmot-config.toml"
    volumes:
      - sudoku-db:/data 
      - ./marmot_build/marmot-config.toml:/data/marmot-config.toml
    depends_on:
      - nats
      - service_layer_rust

  api:
    build:
      context: ./api_python
      dockerfile: Dockerfile
    container_name: api_python
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudokudo-frontend
    depends_on:
      - nats
      - api
      - service_layer_rust
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  sudoku-db: