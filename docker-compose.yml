services:
  nats:
    build:
      context: .
      dockerfile: Dockerfile.nats
    container_name: nats-server
    command: 
    - "--js"
    - "--config"
    - "/etc/nats/nats.conf"
  sudoku_nats_worker:
    build:
      context: ./sudoku_solver_rust
      dockerfile: sudoku_nats_worker/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    container_name: ocr_worker
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  service_layer_rust:
    build:
      context: .
      dockerfile: service_layer_rust/Dockerfile
    container_name: service_layer_rust
    environment:
      - NATS_URL=nats://nats:4222
    volumes:
      - sudoku-db:/data
    depends_on:
      - nats
  
  marmot:
    build:
      context: ./marmot_build
    container_name: marmot-sidecar
    command: 
      - "-node-id"
      - "1"
      - "-config"
      - "/etc/marmot-config.toml"
    volumes:
      - sudoku-db:/data 
    depends_on:
      - nats
      - service_layer_rust

  api:
    build:
      context: ./api_python
      dockerfile: Dockerfile
    container_name: api_python
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - NATS_URL=nats://nats:4222
    volumes:
      - ./api_python/src:/usr/src/app/src
    depends_on:
      - nats
      - service_layer_rust

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudoku-frontend
    depends_on:
      - nats
      - api
      - service_layer_rust
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_MODE=live
      - VITE_API_PROXY_TARGET=http://api:5000
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  sudoku-db: