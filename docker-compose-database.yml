services:
  tests:
    build:
      context: .
      dockerfile: database_connection/Dockerfile.test
    container_name: sudokudo_database_tests
    volumes:
      - sudoku-db-test:/data
      # Mount Docker socket so the test container can manipulate others (like simulating a crash)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - marmot

  marmot:
    image: maxpert/marmot:latest
    container_name: marmot-sidecar-test
    command: 
      - "-db"
      - "/data/test_data.db"
      - "-cluster"
      - "sudoku-cluster-test"
    volumes:
      - sudoku-db-test:/data 

volumes:
  sudoku-db-test:
