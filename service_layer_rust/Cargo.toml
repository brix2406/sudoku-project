[package]
name = "service_layer_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-nats = "0.49.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
sudoku_engine = { path = "../sudoku_solver_rust/sudoku_engine/" }
database = { path = "../database_connection" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
serde_json = "1.0.150"
serde = "1.0.228"
futures = "0.3.32"
# Transitive dep of async-nats; time 0.3.48 fails to compile against async-nats
# (E0119 coherence conflict). Pin until fixed upstream, then remove.
time = "=0.3.47"
sha2 = "0.10"

