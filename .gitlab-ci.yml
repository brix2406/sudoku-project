image: rust:1.88-bookworm
stages:
  - test
  - e2e

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
 
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/
    - sudoku_solver_rust/sudoku_engine/target/

rust-solver-tests:
  stage: test
  before_script:
    - cd sudoku_solver_rust/sudoku_engine
  script:
    - cargo test

ocr-tests:
  stage: test
  image: docker:27.5.1
  tags:
    - priv
  variables:
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker info
  script:
    - docker build -f ocr/Dockerfile.ci -t ocr-ci:cpu ocr/
    - docker run --rm ocr-ci:cpu python3 -m pytest test_label_grids.py -v
verify_privileged:
  image: alpine
  tags:
    - priv
  script:
    - |
      if [ -e /dev/kmsg ]; then
        echo "Runner is PRIVILEGED"
      else
        echo "Runner is NOT privileged"
        exit 1
      fi

nats-worker-api-test:
  stage: test
  image: docker:27.5.1
  extends: .privileged_docker
  before_script:
    - docker info
  script:
    - docker compose -f service_layer_rust/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
  after_script:
    - docker compose -f service_layer_rust/docker-compose.test.yml logs || true
    - docker compose -f service_layer_rust/docker-compose.test.yml down -v || true

database-tests:
  stage: test
  image: docker:27.5.1
  extends: .privileged_docker
  before_script:
    - docker info
  script:
    - docker compose -f database_connection/docker-compose-database.yml up --build --abort-on-container-exit --exit-code-from tests
  after_script:
    - docker compose -f database_connection/docker-compose-database.yml logs || true
    - docker compose -f database_connection/docker-compose-database.yml down -v || true

python-api-nats-test:
  stage: test
  image: docker:27.5.1
  extends: .privileged_docker
  before_script:
    - docker info
  script:
    - docker compose -f api_python/docker-compose.test.yml up python_tests --build --abort-on-container-exit --exit-code-from python_tests
  after_script:
    - docker compose -f api_python/docker-compose.test.yml logs || true
    - docker compose -f api_python/docker-compose.test.yml down -v || true

frontend-docker-build:
  stage: test
  image: docker:27.5.1
  extends: .privileged_docker
  before_script:
    - docker info
  script:
    - docker build -f frontend/Dockerfile frontend


# for DinD jobs (docker compose, docker build, etc.)
.privileged_docker:
  tags:
    - priv
  variables:
    DOCKER_BUILDKIT: "1"
    COMPOSE_DOCKER_CLI_BUILD: "1"
  needs:
    - verify_privileged

api-python-e2e-test:
  stage: e2e
  extends: .privileged_docker
  before_script:
    - docker info
  script:
    - docker compose -f api_python/docker-compose.e2e.yml build --no-cache
    - docker compose -f api_python/docker-compose.e2e.yml up --abort-on-container-exit --exit-code-from e2e
  after_script:
    - docker compose -f api_python/docker-compose.e2e.yml logs || true
    - docker compose -f api_python/docker-compose.e2e.yml down -v || true