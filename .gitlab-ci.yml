image: rust:1.88-bookworm

stages:
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
 
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/
    - sudoku_solver_rust/sudoku_engine/target/

rust-solver-tests:
  stage: test
  before_script:
    - cd sudoku_solver_rust/sudoku_engine
  script:
    - cargo test

verify_privileged:
  image: alpine
  script:
    - |
      if [ -e /dev/kmsg ]; then
        echo "Runner is PRIVILEGED"
      else
        echo "Runner is NOT privileged"
        exit 1
      fi

nats-worker-api-test:
  stage: test
  image: docker:27.5.1
  needs:
    - verify_privileged
  before_script:
    - docker info
  script:
    - docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
  after_script:
    - docker compose -f docker-compose.test.yml logs || true
    - docker compose -f docker-compose.test.yml down -v || true

frontend-docker-build:
  stage: test
  image: docker:27.5.1
  needs:
    - verify_privileged
  before_script:
    - docker info
  script:
    - docker build -f frontend/Dockerfile frontend
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
