image: rust:1.88-bookworm

stages:
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/
    - sudoku_solver_rust/sudoku_engine/target/

rust-solver-tests:
  stage: test
  before_script:
    - cd sudoku_solver_rust/sudoku_engine
  script:
    - cargo test

verify_privileged:
  image: alpine
  script:
    - if [ -e /dev/kmsg ]; then echo "Runner is PRIVILEGED"; else echo "Runner is NOT privileged"; fi

nats-worker-api-test:
  stage: test
  # Fallback to pure local cargo build/run for integration test, using host tools 
  # bypassing Docker socket problems completely.
  services:
    - name: nats:latest
      alias: nats
  variables:
    NATS_URL: "nats://nats:4222"
  script:
    - cargo build -p sudoku_nats_worker --release
    - ./target/release/sudoku_nats_worker > worker.log 2>&1 &
    - WORKER_PID=$!
    - sleep 3
    - cargo test -p service_layer_rust --test worker_nats_api -- --nocapture
  after_script:
    - if [ -n "$WORKER_PID" ]; then kill "$WORKER_PID" || true; fi
    - tail -n 120 worker.log || true
