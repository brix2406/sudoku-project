image: rust:1.88-bookworm

stages:
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/
    - sudoku_solver_rust/sudoku_engine/target/

rust-solver-tests:
  stage: test
  before_script:
    - cd sudoku_solver_rust/sudoku_engine
  script:
    - cargo test

nats-worker-api-test:
  stage: test
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    # Adding a short sleep to allow the DinD daemon to fully wake up
    - sleep 5
    - docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
  after_script:
    - docker compose -f docker-compose.test.yml logs || true
    - docker compose -f docker-compose.test.yml down -v || true
