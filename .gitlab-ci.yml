image: rust:1.88-bookworm

stages:
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/
    - sudoku_solver_rust/sudoku_engine/target/

rust-solver-tests:
  stage: test
  before_script:
    - cd sudoku_solver_rust/sudoku_engine
  script:
    - cargo test

nats-worker-api-test:
  stage: test
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    # Notice this TLS variable! This tells the Docker client to encrypt communication
    # exactly the way the dind service expects it on port 2376
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  script:
    # The runner shares /certs automatically when dind is used
    - sleep 5
    - docker info
    - docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
  after_script:
    - docker compose -f docker-compose.test.yml logs || true
    - docker compose -f docker-compose.test.yml down -v || true
