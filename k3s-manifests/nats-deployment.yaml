apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k3s-manifests
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: nats
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: nats
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k3s-manifests
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: nats
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - args:
            - --js
            - --config
            - /etc/nats/nats.conf
          image: ghcr.io/brix2406/sudoku-project:nats
          imagePullPolicy: Always
          name: nats-server
      restartPolicy: Always
