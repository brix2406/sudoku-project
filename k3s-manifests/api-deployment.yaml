apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k3s-manifests
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: api
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k3s-manifests
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: api
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - env:
            - name: FLASK_ENV
              value: development
            - name: NATS_URL
              value: nats://nats:4222
          image: brix2406/sudoku-project:api
          imagePullPolicy: Always
          name: api-python
          ports:
            - containerPort: 5000
              protocol: TCP
      restartPolicy: Always
