apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k3s-manifests
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: sudoku-nats-worker
  name: sudoku-nats-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: sudoku-nats-worker
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k3s-manifests
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: sudoku-nats-worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - env:
            - name: NATS_URL
              value: nats://nats:4222
          image: ghcr.io/brix2406/sudoku-project:sudoku-nats-worker
          imagePullPolicy: Always
          name: sudoku-nats-worker
      restartPolicy: Always
