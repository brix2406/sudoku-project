apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k3s-manifests
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: ocr
  name: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ocr
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k3s-manifests
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: ocr
    spec:
      containers:
        - env:
            - name: NATS_URL
              value: nats://nats:4222
          image: brix2406/sudoku-project:ocr
          imagePullPolicy: Always
          name: ocr-worker
      restartPolicy: Always
