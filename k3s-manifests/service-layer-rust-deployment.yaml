apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-layer-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: service-layer-rust
  template:
    metadata:
      labels:
        io.kompose.service: service-layer-rust
    spec:
      containers:
        # 1. The Rust Service Layer
        - name: service-layer-rust
          image: brix2406/sudoku-project:service-layer-rust
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: "/data/sudoku.db"
            - name: NATS_URL
              value: "nats://nats:4222"
          volumeMounts:
            - name: sudoku-db-volume
              mountPath: /data

        # 2. The Marmot Sidecar
        - name: marmot-sidecar
          image: brix2406/sudoku-project:marmot
          imagePullPolicy: Always
          command: ["/marmot"]
          args:
            - "-db"
            - "/data/sudoku.db"
            - "-node"
            - "$(POD_NAME)"
            - "-nats"
            - "nats://nats:4222"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: sudoku-db-volume
              mountPath: /data

      volumes:
        - name: sudoku-db-volume
          persistentVolumeClaim:
            claimName: sudoku-db